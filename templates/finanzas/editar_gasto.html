{% extends 'base.html' %}{% block title %}Editar gasto | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Editar gasto</h1><p>Actualiza los datos del gasto seleccionado.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Descripción</label><input type="text" name="descripcion" value="{{ gasto.descripcion }}" required></div><div class="field"><label>Monto</label><input type="number" name="monto" value="{{ gasto.monto }}" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input type="date" name="fecha" value="{{ gasto.fecha|date:'Y-m-d' }}" required></div><div class="field"><label>Tipo</label><select name="tipo"><option value="fijo" {% if gasto.tipo == 'fijo' %}selected{% endif %}>Fijo</option><option value="variable" {% if gasto.tipo == 'variable' %}selected{% endif %}>Variable</option></select></div><div class="field"><label>Categoría</label><select name="categoria" required>{% for c in categorias %}<option value="{{ c.id }}" {% if gasto.categoria_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}</select></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_gastos' %}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form></div>{% endblock %}
