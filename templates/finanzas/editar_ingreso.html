{% extends 'base.html' %}{% block title %}Editar ingreso | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Editar ingreso</h1><p>Actualiza los datos del movimiento seleccionado.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Descripción</label><input type="text" name="descripcion" value="{{ ingreso.descripcion }}" required></div><div class="field"><label>Monto</label><input type="number" name="monto" value="{{ ingreso.monto }}" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input type="date" name="fecha" value="{{ ingreso.fecha|date:'Y-m-d' }}" required></div><div class="field full"><label>Tipo</label><select name="tipo"><option value="fijo" {% if ingreso.tipo == 'fijo' %}selected{% endif %}>Fijo</option><option value="variable" {% if ingreso.tipo == 'variable' %}selected{% endif %}>Variable</option></select></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_ingresos' %}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form></div>{% endblock %}
