{% extends 'base.html' %}{% block title %}Registrar gasto | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Registrar gasto</h1><p>Registra un gasto realizado y asócialo con una categoría.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Descripción</label><input type="text" name="descripcion" value="{{ datos.descripcion }}" maxlength="200" required></div><div class="field"><label>Monto</label><input type="number" name="monto" value="{{ datos.monto }}" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input type="date" name="fecha" value="{{ datos.fecha }}" required></div><div class="field"><label>Tipo</label><select name="tipo"><option value="fijo" {% if datos.tipo == 'fijo' %}selected{% endif %}>Fijo</option><option value="variable" {% if datos.tipo == 'variable' %}selected{% endif %}>Variable</option></select></div><div class="field"><label>Categoría</label><select name="categoria" required><option value="">Seleccionar</option>{% for c in categorias %}<option value="{{ c.id }}" {% if datos.categoria == c.id|stringformat:'s' %}selected{% endif %}>{{ c.nombre }}{% if not c.usuario %} (general){% endif %}</option>{% endfor %}<option value="nueva" {% if datos.categoria == 'nueva' %}selected{% endif %}>Crear nueva categoría</option></select></div><div class="field full"><label>Nueva categoría (solo si seleccionaste crear)</label><input type="text" name="nueva_categoria" value="{{ datos.nueva_categoria }}" maxlength="100"></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_gastos' %}">Volver</a><button class="btn btn-primary" type="submit">Guardar gasto</button></div></form></div>{% endblock %}
