{% extends 'base.html' %}{% block title %}Registrar pendiente | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Registrar gasto pendiente</h1><p>Registra un compromiso que todavía no se ha pagado.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Descripción</label><input type="text" name="descripcion" required></div><div class="field"><label>Monto</label><input type="number" name="monto" min="0.01" step="0.01" required></div><div class="field"><label>Fecha límite</label><input type="date" name="fecha_limite" required></div><div class="field full"><label>Categoría</label><select name="categoria"><option value="">Sin categoría</option>{% for c in categorias %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_gastos_pendientes' %}">Volver</a><button class="btn btn-primary" type="submit">Guardar pendiente</button></div></form></div>{% endblock %}
