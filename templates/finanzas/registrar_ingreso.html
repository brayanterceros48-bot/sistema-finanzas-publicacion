{% extends 'base.html' %}{% block title %}Registrar ingreso | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Registrar ingreso</h1><p>Agrega un ingreso para mantener actualizado el resumen financiero.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Descripción</label><input type="text" name="descripcion" value="{{ datos.descripcion }}" maxlength="200" required></div><div class="field"><label>Monto</label><input type="number" name="monto" value="{{ datos.monto }}" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input type="date" name="fecha" value="{{ datos.fecha }}" required></div><div class="field full"><label>Tipo</label><select name="tipo"><option value="fijo" {% if datos.tipo == 'fijo' %}selected{% endif %}>Fijo</option><option value="variable" {% if datos.tipo == 'variable' %}selected{% endif %}>Variable</option></select></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_ingresos' %}">Volver</a><button class="btn btn-primary" type="submit">Guardar ingreso</button></div></form></div>{% endblock %}
