{% extends 'base.html' %}{% block title %}Nueva meta de ahorro | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Nueva meta de ahorro</h1><p>Define un objetivo y una fecha para alcanzarlo.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Nombre de la meta</label><input type="text" name="nombre" maxlength="200" required></div><div class="field"><label>Monto objetivo</label><input type="number" name="monto_objetivo" min="0.01" step="0.01" required></div><div class="field"><label>Fecha objetivo</label><input type="date" name="fecha_objetivo"></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_metas_ahorro' %}">Volver</a><button class="btn btn-primary" type="submit">Crear meta</button></div></form></div>{% endblock %}
