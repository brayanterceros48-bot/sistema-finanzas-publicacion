{% extends 'base.html' %}{% block title %}Editar presupuesto | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Editar presupuesto</h1><p>Actualiza el límite y el periodo del presupuesto.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Categoría</label><select name="categoria" required>{% for c in categorias %}<option value="{{ c.id }}" {% if presupuesto.categoria_id == c.id %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}</select></div><div class="field"><label>Monto</label><input type="number" name="monto" value="{{ presupuesto.monto }}" min="0.01" step="0.01" required></div><div class="field"><label>Mes</label><select name="mes" required><option value="1" {% if presupuesto.mes == 1 %}selected{% endif %}>Enero</option><option value="2" {% if presupuesto.mes == 2 %}selected{% endif %}>Febrero</option><option value="3" {% if presupuesto.mes == 3 %}selected{% endif %}>Marzo</option><option value="4" {% if presupuesto.mes == 4 %}selected{% endif %}>Abril</option><option value="5" {% if presupuesto.mes == 5 %}selected{% endif %}>Mayo</option><option value="6" {% if presupuesto.mes == 6 %}selected{% endif %}>Junio</option><option value="7" {% if presupuesto.mes == 7 %}selected{% endif %}>Julio</option><option value="8" {% if presupuesto.mes == 8 %}selected{% endif %}>Agosto</option><option value="9" {% if presupuesto.mes == 9 %}selected{% endif %}>Septiembre</option><option value="10" {% if presupuesto.mes == 10 %}selected{% endif %}>Octubre</option><option value="11" {% if presupuesto.mes == 11 %}selected{% endif %}>Noviembre</option><option value="12" {% if presupuesto.mes == 12 %}selected{% endif %}>Diciembre</option></select></div><div class="field"><label>Año</label><input type="number" name="anio" value="{{ presupuesto.anio }}" min="2000" max="2100" required></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_presupuestos' %}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form></div>{% endblock %}
