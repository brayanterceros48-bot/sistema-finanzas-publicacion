{% extends 'base.html' %}{% block title %}Registrar presupuesto | Finanzas Personales{% endblock %}{% block content %}<div class="page-head"><div><h1>Registrar presupuesto</h1><p>Define el límite de gasto de una categoría para un periodo.</p></div></div><div class="card form-card"><form method="post">{% csrf_token %}<div class="form-grid"><div class="field full"><label>Categoría</label><select name="categoria" required><option value="">Seleccionar</option>{% for c in categorias %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}</select></div><div class="field"><label>Monto</label><input type="number" name="monto" min="0.01" step="0.01" required></div><div class="field"><label>Mes</label><select name="mes" required><option value="">Seleccionar</option><option value="1">Enero</option><option value="2">Febrero</option><option value="3">Marzo</option><option value="4">Abril</option><option value="5">Mayo</option><option value="6">Junio</option><option value="7">Julio</option><option value="8">Agosto</option><option value="9">Septiembre</option><option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option></select></div><div class="field"><label>Año</label><input type="number" name="anio" min="2000" max="2100" required></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'lista_presupuestos' %}">Volver</a><button class="btn btn-primary" type="submit">Guardar presupuesto</button></div></form></div>{% endblock %}
