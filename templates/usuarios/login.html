<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Iniciar sesión | Finanzas Personales</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fb;font-family:Arial,Helvetica,sans-serif;color:#172033;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:32px;box-shadow:0 8px 30px rgba(15,23,42,.06)}.logo{width:52px;height:52px;border-radius:12px;background:#166534;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-weight:700}.card h1{text-align:center;margin:0 0 8px;font-size:26px}.subtitle{text-align:center;color:#64748b;font-size:14px;margin:0 0 24px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#475569}.field input{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px}.btn{width:100%;height:42px;border:0;border-radius:8px;background:#166534;color:#fff;font-weight:700;cursor:pointer;margin-top:6px}.links{text-align:center;margin-top:18px;font-size:13px;color:#64748b}.links a{color:#166534;text-decoration:none;font-weight:700}.message{padding:11px 12px;background:#fef2f2;color:#991b1b;border-radius:8px;margin-bottom:10px;font-size:13px}
</style></head><body>
<div class="card"><div class="logo">$</div>
<h1>Iniciar sesión</h1><p class="subtitle">Accede a tu sistema de finanzas personales.</p>{% if messages %}{% for message in messages %}
<div class="message">{{ message }}</div>{% endfor %}{% endif %}<form method="post">{% csrf_token %}
<div class="field"><label for="correo">Correo electrónico</label>
<input id="correo" name="correo" type="email" required autofocus></div><div class="field"><label for="password">Contraseña</label>
<input id="password" name="password" type="password" required></div>
<button class="btn" type="submit">Iniciar sesión</button>
</form><div class="links">¿No tienes una cuenta? <a href="{% url 'registro' %}">Crear cuenta</a>
</div></div>
<div style="margin-top:12px;">
    <a href="{% url 'recuperar_password' %}">
        ¿Olvidaste tu contraseña?
    </a>
</div>
</body></html>
