{% extends 'base.html' %}

{% block title %}Correo enviado | Finanzas Personales{% endblock %}

{% block content %}
<div class="card form-card">
    <h2>Revisa tu correo electrónico</h2>

    <p class="card-subtitle">
        Si existe una cuenta asociada al correo ingresado,
        se ha enviado un enlace para restablecer la contraseña.
    </p>

    <div class="actions">
        <a class="btn btn-primary" href="{% url 'login' %}">
            Volver a iniciar sesión
        </a>
    </div>
</div>
{% endblock %}
