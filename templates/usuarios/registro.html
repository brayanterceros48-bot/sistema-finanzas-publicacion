<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Finanzas Personales</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
        }

        .tarjeta {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #1f7a4d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .campo input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .campo input:focus {
            border-color: #1f7a4d;
            box-shadow: 0 0 0 3px rgba(31, 122, 77, 0.12);
        }

        .boton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1f7a4d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        .boton:hover {
            background: #17613c;
        }

        .mensajes {
            margin-bottom: 20px;
        }

        .mensaje {
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            margin-bottom: 8px;
            background: #fef2f2;
            color: #991b1b;
        }

        .pie {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .tarjeta {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="tarjeta">

            <div class="logo">
                $
            </div>

            <h1>Crear cuenta</h1>

            <p class="subtitulo">
                Comienza a organizar tus finanzas y toma mejores
                decisiones con tu dinero.
            </p>

            {% if messages %}
                <div class="mensajes">
                    {% for message in messages %}
                        <div class="mensaje">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="campo">
                    <label for="nombre_completo">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre_completo"
                        name="nombre_completo"
                        placeholder="Ej. Juan Pérez"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ej. correo@gmail.com"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa una contraseña"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="password_confirmacion">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="password_confirmacion"
                        name="password_confirmacion"
                        placeholder="Repite tu contraseña"
                        required
                    >
                </div>

                <button type="submit" class="boton">
                    Crear cuenta
                </button>
            </form>

            <div class="pie">
                Finanzas Personales · Sistema de gestión financiera
            </div>

        </div>

    </div>

<div style="text-align:center;margin-top:18px;color:#64748b;font-size:13px">¿Ya tienes una cuenta? <a href="{% url 'login' %}" style="color:#166534;font-weight:700;text-decoration:none">Iniciar sesión</a></div>
</body>
</html>
